services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyrus
      POSTGRES_USER: cyrus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cyrus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyrus -d cyrus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cyrus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}@db:5432/cyrus}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CYRUS_EXTERNAL_WORKER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CYRUS_LLM_API_KEY: ${CYRUS_LLM_API_KEY:-}
      CYRUS_ACCESS_KEY: ${CYRUS_ACCESS_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CYRUS_MODEL: ${CYRUS_MODEL:-gpt-6-luna}
      CYRUS_MAX_OUTPUT_TOKENS: ${CYRUS_MAX_OUTPUT_TOKENS:-1200}
      CYRUS_LLM_TIMEOUT_SECONDS: ${CYRUS_LLM_TIMEOUT_SECONDS:-35}
      CYRUS_PROVIDER_RETRIES: ${CYRUS_PROVIDER_RETRIES:-2}
      CYRUS_ENABLE_WEB_SEARCH: ${CYRUS_ENABLE_WEB_SEARCH:-false}
      CYRUS_WORKER_HEARTBEAT_TTL_SECONDS: ${CYRUS_WORKER_HEARTBEAT_TTL_SECONDS:-90}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy


  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cyrus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}@db:5432/cyrus}
      CYRUS_EXTERNAL_WORKER: "true"
      CYRUS_WORKER_ID: compose-worker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CYRUS_LLM_API_KEY: ${CYRUS_LLM_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CYRUS_MODEL: ${CYRUS_MODEL:-gpt-6-luna}
      CYRUS_MAX_OUTPUT_TOKENS: ${CYRUS_MAX_OUTPUT_TOKENS:-1200}
      CYRUS_LLM_TIMEOUT_SECONDS: ${CYRUS_LLM_TIMEOUT_SECONDS:-35}
      CYRUS_PROVIDER_RETRIES: ${CYRUS_PROVIDER_RETRIES:-2}
      CYRUS_ENABLE_WEB_SEARCH: ${CYRUS_ENABLE_WEB_SEARCH:-false}
      CYRUS_WORKER_POLL_SECONDS: ${CYRUS_WORKER_POLL_SECONDS:-2}
      CYRUS_WORKER_HEARTBEAT_SECONDS: ${CYRUS_WORKER_HEARTBEAT_SECONDS:-15}
      CYRUS_WORKER_HEARTBEAT_TTL_SECONDS: ${CYRUS_WORKER_HEARTBEAT_TTL_SECONDS:-90}
      CYRUS_WORKER_STALE_SECONDS: ${CYRUS_WORKER_STALE_SECONDS:-600}
    # The API initializes the shared schema before the worker starts polling.
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.main import worker_is_ready; assert worker_is_ready()"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - cyrus-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  cyrus-postgres:
  cyrus-node-modules:
