services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyrus
      POSTGRES_USER: cyrus
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - cyrus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyrus -d cyrus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://cyrus:change-me@db:5432/cyrus
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - cyrus-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  cyrus-postgres:
  cyrus-node-modules:
