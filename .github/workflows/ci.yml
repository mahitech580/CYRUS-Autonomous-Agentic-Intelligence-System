name: CYRUS checks

permissions:
  contents: read

concurrency:
  group: cyrus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-cyrus.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Verify local Compose exposure and container hardening
        working-directory: .
        run: |
          POSTGRES_PASSWORD=ci-only-placeholder docker compose config --format json > /tmp/cyrus-compose.json
          python - <<'PY'
          import json

          with open("/tmp/cyrus-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]

          def has_loopback_port(service_name, published_port):
              return any(
                  str(port.get("published")) == str(published_port)
                  and str(port.get("target")) == str(published_port)
                  and port.get("host_ip") == "127.0.0.1"
                  for port in services[service_name].get("ports", [])
              )

          assert has_loopback_port("db", 5432), "PostgreSQL must bind to loopback"
          assert has_loopback_port("api", 8000), "API must bind to loopback"
          assert has_loopback_port("web", 5173), "Workspace dev server must bind to loopback"
          assert services["db"]["environment"]["POSTGRES_PASSWORD"] == "ci-only-placeholder"
          assert "change-me" not in json.dumps(config)

          for service_name in ("api", "worker"):
              service = services[service_name]
              assert service.get("init") is True, f"{service_name} must use an init process"
              assert "no-new-privileges:true" in service.get("security_opt", [])
              assert "ALL" in service.get("cap_drop", [])
          PY
      - name: Build and smoke-test the non-root API container
        working-directory: .
        run: |
          docker build --file Dockerfile.api --tag cyrus-api:ci .
          docker run --detach --rm --name cyrus-api-ci --publish 8000:8000 cyrus-api:ci
          trap 'docker stop cyrus-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec cyrus-api-ci python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)); assert data['status'] == 'ok'"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then docker logs cyrus-api-ci; exit 1; fi
            sleep 1
          done
          docker exec cyrus-api-ci python -c "import os; assert os.getuid() == 10001"
