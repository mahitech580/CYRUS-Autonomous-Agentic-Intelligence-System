name: CYRUS checks

permissions:
  contents: read

concurrency:
  group: cyrus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-cyrus.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -q -W error::starlette.exceptions.StarletteDeprecationWarning
      - name: Verify local Compose exposure and container hardening
        working-directory: .
        run: |
          POSTGRES_PASSWORD=ci-only-placeholder docker compose config --format json > /tmp/cyrus-compose.json
          python - <<'PY'
          import json

          with open("/tmp/cyrus-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]

          def has_loopback_port(service_name, published_port):
              return any(
                  str(port.get("published")) == str(published_port)
                  and str(port.get("target")) == str(published_port)
                  and port.get("host_ip") == "127.0.0.1"
                  for port in services[service_name].get("ports", [])
              )

          assert has_loopback_port("db", 5432), "PostgreSQL must bind to loopback"
          assert has_loopback_port("api", 8000), "API must bind to loopback"
          assert has_loopback_port("web", 5173), "Workspace dev server must bind to loopback"
          assert services["db"]["environment"]["POSTGRES_PASSWORD"] == "ci-only-placeholder"
          assert "change-me" not in json.dumps(config)

          for service_name in ("api", "worker"):
              service = services[service_name]
              assert service.get("init") is True, f"{service_name} must use an init process"
              assert "no-new-privileges:true" in service.get("security_opt", [])
              assert "ALL" in service.get("cap_drop", [])
          PY
      - name: Build and smoke-test the non-root API and durable worker containers
        working-directory: .
        run: |
          set -euo pipefail
          docker build --file Dockerfile.api --tag cyrus-api:ci .
          cleanup() {
            docker stop --time 15 cyrus-worker-ci >/dev/null 2>&1 || true
            docker stop cyrus-api-worker-ci >/dev/null 2>&1 || true
            docker stop cyrus-api-ci >/dev/null 2>&1 || true
            docker volume rm cyrus-worker-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --rm --name cyrus-api-ci --publish 127.0.0.1:8000:8000 cyrus-api:ci
          for attempt in $(seq 1 30); do
            if docker exec cyrus-api-ci python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)); assert data['status'] == 'ok'"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then docker logs cyrus-api-ci; exit 1; fi
            sleep 1
          done
          docker exec cyrus-api-ci python -c "import os; assert os.getuid() == 10001"
          docker stop cyrus-api-ci >/dev/null

          # Share a writable database volume between two non-root containers.
          docker volume create cyrus-worker-ci-data >/dev/null
          docker run --rm --user 0 --volume cyrus-worker-ci-data:/data --entrypoint sh cyrus-api:ci -c "chown 10001:10001 /data"
          docker run --detach --rm --name cyrus-api-worker-ci --publish 127.0.0.1:8000:8000 --volume cyrus-worker-ci-data:/data --env DATABASE_URL=sqlite:////data/cyrus.db --env CYRUS_ENVIRONMENT=production --env CYRUS_ACCESS_KEY=ci-only-test-key --env CYRUS_EXTERNAL_WORKER=true --env CYRUS_WORKER_HEARTBEAT_TTL_SECONDS=30 cyrus-api:ci
          for attempt in $(seq 1 30); do
            if docker exec cyrus-api-worker-ci python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)); assert data['status'] == 'ok'"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then docker logs cyrus-api-worker-ci; exit 1; fi
            sleep 1
          done

          docker run --detach --rm --name cyrus-worker-ci --volume cyrus-worker-ci-data:/data --env DATABASE_URL=sqlite:////data/cyrus.db --env CYRUS_ENVIRONMENT=production --env CYRUS_EXTERNAL_WORKER=true --env CYRUS_WORKER_ID=ci-worker --env CYRUS_WORKER_POLL_SECONDS=0.5 --env CYRUS_WORKER_HEARTBEAT_SECONDS=5 --env CYRUS_WORKER_HEARTBEAT_TTL_SECONDS=30 cyrus-api:ci python -m backend.worker
          docker exec cyrus-api-worker-ci python -c 'import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/config", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("missing workspace access key was accepted")'

          for attempt in $(seq 1 30); do
            if docker exec cyrus-api-worker-ci python -c 'import json, urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/api/config", headers={"Authorization": "Bearer ci-only-test-key"}); data = json.load(urllib.request.urlopen(request, timeout=2)); assert data["worker_required"] and data["worker_ready"] and not data["provider_configured"] and not data["persistent_storage"] and not data["can_start_runs"]' >/dev/null 2>&1; then
              echo "Worker heartbeat registered; production access, provider, and storage gates remain enforced."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker exec cyrus-api-worker-ci python -c 'import json, urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/api/config", headers={"Authorization": "Bearer ci-only-test-key"}); print(json.dumps(json.load(urllib.request.urlopen(request, timeout=2)), indent=2))' || true
              docker logs cyrus-worker-ci
              docker logs cyrus-api-worker-ci
              exit 1
            fi
            sleep 1
          done
          docker exec cyrus-worker-ci python -c "import os; assert os.getuid() == 10001"

          docker stop --time 15 cyrus-worker-ci >/dev/null
          for attempt in $(seq 1 15); do
            if docker exec cyrus-api-worker-ci python -c 'import json, urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/api/config", headers={"Authorization": "Bearer ci-only-test-key"}); data = json.load(urllib.request.urlopen(request, timeout=2)); assert data["worker_ready"] is False' >/dev/null 2>&1; then
              echo "Worker shutdown removed its heartbeat and readiness was withdrawn."
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker exec cyrus-api-worker-ci python -c 'import json, urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/api/config", headers={"Authorization": "Bearer ci-only-test-key"}); print(json.dumps(json.load(urllib.request.urlopen(request, timeout=2)), indent=2))' || true
              docker logs cyrus-api-worker-ci
              exit 1
            fi
            sleep 1
          done
