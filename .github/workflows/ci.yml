name: CYRUS checks

permissions:
  contents: read

concurrency:
  group: cyrus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-cyrus.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Build and smoke-test the non-root API container
        working-directory: .
        run: |
          docker build --file Dockerfile.api --tag cyrus-api:ci .
          docker run --detach --rm --name cyrus-api-ci --publish 8000:8000 cyrus-api:ci
          trap 'docker stop cyrus-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec cyrus-api-ci python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)); assert data['status'] == 'ok'"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then docker logs cyrus-api-ci; exit 1; fi
            sleep 1
          done
          docker exec cyrus-api-ci python -c "import os; assert os.getuid() == 10001"
