name: CYRUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q server.py tests

      - name: Run API contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate browser JavaScript
        run: |
          npx --yes esbuild@0.25.11 app.js --loader:.js=jsx --outfile=/tmp/cyrus-app.js
          node --check demo-bridge.js
          node tests/test_demo_bridge.js
