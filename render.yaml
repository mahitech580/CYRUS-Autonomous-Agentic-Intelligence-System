services:
  - type: web
    name: cyrus-agentic-api-mahitech580
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --graceful-timeout 30 server:app
    healthCheckPath: /api/health
    envVars:
      - key: CYRUS_RELEASE
        value: render-main
      - key: CYRUS_CORS_ORIGINS
        value: https://mahitech580.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: CYRUS_API_ACCESS_KEY
        sync: false
      - key: CYRUS_DATABASE_URL
        sync: false
      - key: CYRUS_LLM_API_KEY
        sync: false
      - key: CYRUS_LLM_PROVIDER
        value: auto
      - key: CYRUS_LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: CYRUS_LLM_MODEL
        value: gpt-4o-mini
      - key: CYRUS_LLM_TIMEOUT_SECONDS
        value: "25"
